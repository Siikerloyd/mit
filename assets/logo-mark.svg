<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none" width="36" height="36">
  <defs>
    <linearGradient id="markTop" x1="4" y1="3" x2="32" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="markLeft" x1="4" y1="11" x2="18" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="markRight" x1="18" y1="19" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F2864" />
    </linearGradient>
    <filter id="markGlowSquare" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B82F6" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#markGlowSquare)">
    <!-- Top Face -->
    <polygon points="18,3 32,11 18,19 4,11" fill="url(#markTop)" stroke="#93C5FD" stroke-width="0.8" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="4,11 18,19 18,33 4,25" fill="url(#markLeft)" stroke="#60A5FA" stroke-width="0.8" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="18,19 32,11 32,25 18,33" fill="url(#markRight)" stroke="#3B82F6" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Internal Crate Seam Lines -->
    <path d="M11 7 L25 15" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.8" stroke-linecap="round" />
    <path d="M4 18 L18 26" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.75" />
    <path d="M18 26 L32 18" stroke="#60A5FA" stroke-opacity="0.3" stroke-width="0.75" />

    <!-- Center Pivot Highlight Pip -->
    <circle cx="18" cy="19" r="2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="18" cy="19" r="1" fill="#3B82F6" />
  </g>
</svg>

